name: Portfolio Security

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Secrets, dependencies and data safety
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository and data-file policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import csv
          import json
          import re
          import subprocess
          import sys
          import zipfile

          root = Path('.').resolve()
          errors = []
          blocked_names = {
              '.env', 'id_rsa', 'id_dsa', 'credentials.json',
              'service-account.json',
          }
          blocked_extensions = {
              '.exe', '.dll', '.scr', '.bat', '.cmd', '.ps1', '.com',
              '.msi', '.jar', '.apk', '.dmg', '.iso',
          }
          excel_extensions = {'.xlsx', '.xlsm', '.xltx', '.xltm'}

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          files = []
          for raw_path in tracked:
              if not raw_path:
                  continue
              try:
                  relative = Path(raw_path.decode('utf-8', errors='strict'))
              except UnicodeError as exc:
                  errors.append(f'Invalid UTF-8 repository path: {exc}')
                  continue

              path = root / relative
              try:
                  path.resolve(strict=False).relative_to(root)
              except (OSError, ValueError) as exc:
                  errors.append(f'Path escapes repository: {relative}: {exc}')
                  continue

              if path.is_symlink():
                  try:
                      path.resolve(strict=True).relative_to(root)
                  except (OSError, ValueError) as exc:
                      errors.append(f'Unsafe symlink: {relative}: {exc}')
                      continue

              if not path.is_file():
                  continue
              files.append((relative, path))

              if (
                  path.name.lower() in blocked_names
                  or path.suffix.lower() in blocked_extensions
              ):
                  errors.append(f'Blocked file: {relative}')

          for relative, path in files:
              suffix = path.suffix.lower()

              if suffix in excel_extensions:
                  try:
                      with zipfile.ZipFile(path) as archive:
                          names = archive.namelist()
                          if (
                              '[Content_Types].xml' not in names
                              or 'xl/workbook.xml' not in names
                          ):
                              errors.append(f'Invalid Excel archive: {relative}')

                          uncompressed = 0
                          compressed = 0
                          for item in archive.infolist():
                              member = PurePosixPath(item.filename)
                              if (
                                  member.is_absolute()
                                  or '..' in member.parts
                                  or '\\' in item.filename
                              ):
                                  errors.append(
                                      f'Excel path traversal: {relative}:{item.filename}'
                                  )
                              if item.file_size > 200_000_000:
                                  errors.append(
                                      f'Oversized Excel member: {relative}:{item.filename}'
                                  )
                              uncompressed += item.file_size
                              compressed += max(item.compress_size, 1)

                          if (
                              uncompressed > 1_000_000_000
                              or uncompressed / max(compressed, 1) > 200
                          ):
                              errors.append(
                                  f'Suspicious Excel archive expansion: {relative}'
                              )
                  except (OSError, zipfile.BadZipFile, zipfile.LargeZipFile) as exc:
                      errors.append(f'Unreadable Excel archive {relative}: {exc}')

              elif suffix == '.ipynb':
                  try:
                      notebook = json.loads(path.read_text(encoding='utf-8'))
                  except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                      errors.append(f'Invalid notebook {relative}: {exc}')
                      continue

                  if notebook.get('nbformat', 0) < 4:
                      errors.append(f'Notebook must use nbformat 4+: {relative}')

                  for index, cell in enumerate(notebook.get('cells', []), 1):
                      if cell.get('cell_type') != 'code':
                          continue
                      source = ''.join(cell.get('source', []))
                      lowered = source.lower()

                      if cell.get('outputs') or cell.get('execution_count') is not None:
                          errors.append(
                              f'Notebook outputs/execution count must be cleared: '
                              f'{relative} cell {index}'
                          )
                      if re.search(
                          r'(^|\n)\s*[!%](curl|wget|pip\s+install\s+https?://)',
                          source,
                          re.I,
                      ):
                          errors.append(
                              f'Notebook downloads remote code: {relative} cell {index}'
                          )
                      if any(
                          pattern in lowered
                          for pattern in (
                              'curl | sh', 'wget | sh', 'rm -rf /',
                              'subprocess.popen', 'os.system(',
                          )
                      ):
                          errors.append(
                              f'Unsafe notebook command: {relative} cell {index}'
                          )
                      if re.search(
                          r'\b(api[_-]?key|password|secret|token)\s*=',
                          source,
                          re.I,
                      ):
                          errors.append(
                              f'Possible credential assignment: {relative} cell {index}'
                          )

              elif suffix == '.csv':
                  try:
                      with path.open(
                          encoding='utf-8-sig', newline='', errors='strict'
                      ) as handle:
                          for row_number, row in enumerate(csv.reader(handle), 1):
                              for column_number, original in enumerate(row, 1):
                                  value = original.lstrip()
                                  unsafe = value.startswith(
                                      ('=', '+', '@', '\t', '\r')
                                  )
                                  unsafe = unsafe or (
                                      value.startswith('-')
                                      and not re.fullmatch(
                                          r'-?\d+(\.\d+)?([eE][+-]?\d+)?', value
                                      )
                                  )
                                  if unsafe:
                                      errors.append(
                                          'CSV formula injection risk: '
                                          f'{relative}:{row_number}:{column_number}'
                                      )
                  except (OSError, UnicodeError, csv.Error) as exc:
                      errors.append(f'Unreadable CSV {relative}: {exc}')

          action = re.compile(r'^\s*uses:\s*[^\s@]+@([^\s#]+)', re.M)
          for workflow in Path('.github/workflows').glob('*.y*ml'):
              try:
                  workflow_text = workflow.read_text(encoding='utf-8')
              except (OSError, UnicodeError) as exc:
                  errors.append(f'Unreadable workflow {workflow}: {exc}')
                  continue
              for ref in action.findall(workflow_text):
                  if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                      errors.append(
                          f'Non-immutable action reference in {workflow}: @{ref}'
                      )

          if errors:
              print('\n'.join(f'::error::{error}' for error in errors))
              sys.exit(1)
          PY

      - name: Gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t requirement_files < <(
            find . -type f -name 'requirements*.txt' -not -path './.git/*' -print
          )

          if (( ${#requirement_files[@]} > 0 )) \
            || [[ -f pyproject.toml ]] \
            || [[ -f Pipfile.lock ]]; then
            python3 -m pip install --disable-pip-version-check pip-audit==2.9.0
          fi

          for file in "${requirement_files[@]}"; do
            python3 -m pip_audit -r "$file"
          done

          if [[ -f pyproject.toml ]]; then
            python3 -m pip_audit .
          fi

          if [[ -f Pipfile.lock ]]; then
            python3 - <<'PY' > /tmp/pipfile-requirements.txt
          import json
          from pathlib import Path

          lock = json.loads(Path('Pipfile.lock').read_text(encoding='utf-8'))
          for section in ('default', 'develop'):
              for name, metadata in lock.get(section, {}).items():
                  version = metadata.get('version') if isinstance(metadata, dict) else None
                  if version:
                      print(f'{name}{version}')
          PY
            if [[ -s /tmp/pipfile-requirements.txt ]]; then
              python3 -m pip_audit -r /tmp/pipfile-requirements.txt
            fi
          fi

          [[ ! -f package-lock.json ]] || npm audit --audit-level=high
          [[ ! -f npm-shrinkwrap.json ]] || npm audit --audit-level=high

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Detect analyzable Python source
        id: detect-python
        shell: bash
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' -print -quit | grep -q .; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "Python source detected; CodeQL analysis will run."
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Python source files detected; CodeQL Python analysis is not applicable."
          fi

      - name: Initialize CodeQL
        if: steps.detect-python.outputs.python == 'true'
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07
        with:
          languages: python
          queries: security-extended

      - name: Analyze with CodeQL
        if: steps.detect-python.outputs.python == 'true'
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07

      - name: Record CodeQL applicability
        if: steps.detect-python.outputs.python != 'true'
        run: echo "CodeQL Python scan skipped because this portfolio repository contains no .py source files."
