      <circle cx="60" cy="87" r="34" fill="none" stroke="#E2B93B" stroke-width="16" stroke-dasharray="45 169" stroke-dashoffset="-92" transform="rotate(-90 60 87)"/>
      <g fill="#CFEAE3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10"><text x="108" y="69">Office Supplies</text><text x="108" y="91">Technology</text><text x="108" y="113">Furniture</text></g>
      <g><rect x="95" y="59" width="8" height="8" rx="2" fill="#36D3B5"/><rect x="95" y="81" width="8" height="8" rx="2" fill="#E2B93B"/><rect x="95" y="103" width="8" height="8" rx="2" fill="#2A7183"/></g>
