      <text x="24" y="38" fill="#76E2B0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">TECHNOLOGY STACK</text>
      <g fill="#F2FFFA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15"><text x="24" y="78">▰  Microsoft Power BI</text><text x="24" y="111">ƒx  DAX Measures</text><text x="24" y="144">⌁  Power Query</text><text x="24" y="177">↗  Forecast Analytics</text></g>
