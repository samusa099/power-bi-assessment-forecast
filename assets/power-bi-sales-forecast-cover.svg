    <rect width="580" height="650" rx="34" fill="#FFFFFF"/>
    <rect x="0" y="0" width="580" height="78" rx="34" fill="#0F172A"/>
    <rect x="0" y="45" width="580" height="33" fill="#0F172A"/>
    <circle cx="40" cy="39" r="9" fill="#F2C811"/>
    <circle cx="68" cy="39" r="9" fill="#64748B"/>
    <circle cx="96" cy="39" r="9" fill="#64748B"/>
    <text x="140" y="47" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF">Executive Sales Overview</text>

