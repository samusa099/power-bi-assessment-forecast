      <text x="18" y="75" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#0F172A">$1.57M</text>
      <rect x="170" width="154" height="102" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="188" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#64748B">Profit</text>
      <text x="188" y="75" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#0F172A">$175K</text>
      <rect x="340" width="172" height="102" rx="18" fill="#FFF9D8" stroke="#F2C811"/>
      <text x="358" y="34" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#806A00">Avg. Delivery</text>
      <text x="358" y="75" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="800" fill="#0F172A">4 Days</text>
