      <g fill="#335B51" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15"><text x="24" y="76">⌂  Project Overview</text><text x="24" y="107">✦  Key Features</text><text x="24" y="138">▣  Report Gallery</text><text x="24" y="169">◫  How to Use</text></g>
