        <g><rect width="205" height="111" rx="15" fill="#FFFFFF" stroke="#D8E6E1"/><circle cx="31" cy="31" r="17" fill="#E2F7EC"/><text x="31" y="37" text-anchor="middle" fill="#0B7A50" font-size="19">↗</text><text x="58" y="29" fill="#18443A" font-size="15" font-weight="800">Sales Forecasting</text><text x="20" y="63" fill="#657D77" font-size="12">Historical trends and</text><text x="20" y="82" fill="#657D77" font-size="12">future sales direction.</text></g>
        <g transform="translate(220 0)"><rect width="205" height="111" rx="15" fill="#FFFFFF" stroke="#D8E6E1"/><circle cx="31" cy="31" r="17" fill="#E5F8F6"/><text x="31" y="37" text-anchor="middle" fill="#07867C" font-size="18">▦</text><text x="58" y="29" fill="#18443A" font-size="15" font-weight="800">Interactive Dashboard</text><text x="20" y="63" fill="#657D77" font-size="12">Slicers, KPI cards and</text><text x="20" y="82" fill="#657D77" font-size="12">decision-ready visuals.</text></g>
        <g transform="translate(440 0)"><rect width="205" height="111" rx="15" fill="#FFFFFF" stroke="#D8E6E1"/><circle cx="31" cy="31" r="17" fill="#EAF3FF"/><text x="31" y="37" text-anchor="middle" fill="#3078C7" font-size="18">◎</text><text x="58" y="29" fill="#18443A" font-size="15" font-weight="800">Performance Analysis</text><text x="20" y="63" fill="#657D77" font-size="12">Products, regions, segments</text><text x="20" y="82" fill="#657D77" font-size="12">and operational results.</text></g>
        <g transform="translate(660 0)"><rect width="205" height="111" rx="15" fill="#FFFFFF" stroke="#D8E6E1"/><circle cx="31" cy="31" r="17" fill="#FFF6D8"/><text x="31" y="37" text-anchor="middle" fill="#B88900" font-size="18">✦</text><text x="58" y="29" fill="#18443A" font-size="15" font-weight="800">Business Insights</text><text x="20" y="63" fill="#657D77" font-size="12">Clear findings for better</text><text x="20" y="82" fill="#657D77" font-size="12">planning and decisions.</text></g>
