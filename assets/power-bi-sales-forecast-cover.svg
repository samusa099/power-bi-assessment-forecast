      <path d="M26 132 L58 119 L88 126 L120 92 L150 103 L181 70 L212 85 L244 51 L276 65 L307 38" fill="none" stroke="#38D6BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
