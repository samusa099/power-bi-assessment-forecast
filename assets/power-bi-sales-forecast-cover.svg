    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#5EE1B6" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" rx="34" fill="url(#hero)"/>
  <rect width="1600" height="555" rx="34" fill="url(#grid)"/>
