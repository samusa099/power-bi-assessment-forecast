  <text x="80" y="416" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700">From historical transactions to forward-looking business decisions.</text>
  <text x="80" y="457" fill="#AAC9C2" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20">Interactive Power BI dashboards • Power Query • DAX • Forecast analytics</text>

