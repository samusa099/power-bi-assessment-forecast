    <g transform="translate(34 238)">
      <rect width="326" height="220" rx="20" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="20" y="34" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155">Monthly Sales Trend</text>
      <line x1="34" y1="178" x2="298" y2="178" stroke="#CBD5E1" stroke-width="2"/>
      <line x1="34" y1="70" x2="34" y2="178" stroke="#CBD5E1" stroke-width="2"/>
      <polyline points="34,158 72,140 110,146 148,108 186,119 224,82 262,95 298,54" fill="none" stroke="#F2C811" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <g fill="#0F172A">
        <circle cx="34" cy="158" r="5"/><circle cx="72" cy="140" r="5"/><circle cx="110" cy="146" r="5"/><circle cx="148" cy="108" r="5"/><circle cx="186" cy="119" r="5"/><circle cx="224" cy="82" r="5"/><circle cx="262" cy="95" r="5"/><circle cx="298" cy="54" r="5"/>
      </g>
    </g>

    <g transform="translate(378 238)">
      <rect width="168" height="220" rx="20" fill="#0F172A"/>
      <text x="20" y="36" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">By Region</text>
      <rect x="20" y="68" width="104" height="18" rx="9" fill="#334155"/>
      <rect x="20" y="68" width="86" height="18" rx="9" fill="#F2C811"/>
      <rect x="20" y="103" width="104" height="18" rx="9" fill="#334155"/>
      <rect x="20" y="103" width="70" height="18" rx="9" fill="#E2A600"/>
      <rect x="20" y="138" width="104" height="18" rx="9" fill="#334155"/>
      <rect x="20" y="138" width="58" height="18" rx="9" fill="#94A3B8"/>
      <rect x="20" y="173" width="104" height="18" rx="9" fill="#334155"/>
      <rect x="20" y="173" width="42" height="18" rx="9" fill="#64748B"/>
    </g>

    <g transform="translate(34 484)">
      <rect width="512" height="132" rx="20" fill="#FFFDF1" stroke="#F2C811"/>
      <text x="20" y="36" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155">Forecast Outlook</text>
      <path d="M22 98 C90 92, 104 62, 158 70 S244 106, 294 72 S388 40, 488 57" fill="none" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
      <path d="M294 72 C350 51, 412 44, 488 57" fill="none" stroke="#F2C811" stroke-width="8" stroke-linecap="round" stroke-dasharray="12 12"/>
      <path d="M294 52 C360 25, 425 25, 488 37 L488 80 C425 69, 360 75, 294 94 Z" fill="#F2C811" opacity="0.18"/>
    </g>
