<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Power BI Sales Dashboard and Forecasting Assessment</title>
  <desc id="desc">Professional portfolio cover for a Power BI sales analytics and forecasting project by Musa.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E9EEF5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2C811"/>
      <stop offset="1" stop-color="#E9A900"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1480" cy="70" r="240" fill="#F2C811" opacity="0.10"/>
  <circle cx="80" cy="850" r="210" fill="#2563EB" opacity="0.06"/>

  <g transform="translate(110 110)">
    <rect x="0" y="0" width="132" height="44" rx="22" fill="#0F172A"/>
    <text x="66" y="29" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">5B10-C13</text>

    <text x="0" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#E2A600" letter-spacing="2">POWER BI PORTFOLIO PROJECT</text>
    <text x="0" y="215" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#0F172A">Sales Dashboard</text>
    <text x="0" y="300" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#0F172A">&amp; Forecasting</text>

    <text x="0" y="365" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#475569">Interactive business intelligence, trend analysis,</text>
    <text x="0" y="405" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#475569">regional performance and forward-looking sales insight.</text>

    <g transform="translate(0 485)">
      <rect width="178" height="54" rx="27" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="89" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#334155">Power Query</text>
      <rect x="194" width="102" height="54" rx="27" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="245" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#334155">DAX</text>
      <rect x="312" width="196" height="54" rx="27" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="410" y="35" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#334155">Sales Analytics</text>
    </g>

    <g transform="translate(0 650)">
      <rect width="10" height="70" rx="5" fill="url(#accent)"/>
